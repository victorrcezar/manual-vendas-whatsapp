    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #F5F5F5;
      }
      ::-webkit-scrollbar-thumb {
        background: #2C3E50;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C49B66;
      }

      /* Utility for PDF generation visibility */
      .pdf-hidden-container {
        position: fixed;
        left: -9999px;
        top: 0;
        width: 210mm; /* A4 Width */
        min-height: 297mm;
        background-color: white;
        z-index: -1;
      }
    </style>
